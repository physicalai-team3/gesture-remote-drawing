<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gesture Camera</title>
<style>
  body { margin:0; background:#111; color:#eee; font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  video { flex:1; width:100%; object-fit:cover; background:#000; }
  video.mirror { transform:scaleX(-1); }
  .bar { display:flex; gap:8px; padding:10px 16px; align-items:center; flex-wrap:wrap; }
  button { flex:1; padding:12px; border:0; border-radius:8px; font-size:16px; background:#2a9d8f; color:#fff; }
  button.secondary { background:#333; }
  #status { font:12px ui-monospace, monospace; padding:0 16px 10px; color:#aaa; white-space:pre; }
  .dot { width:10px; height:10px; border-radius:50%; background:#d1495b; display:inline-block; }
  .dot.on { background:#2a9d8f; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay class="mirror"></video>
<div class="bar">
  <span class="dot" id="dot"></span><span id="conn">연결 중…</span>
</div>
<div class="bar">
  <button id="start">카메라 시작</button>
  <button id="flip" class="secondary">전/후면 전환</button>
</div>
<div id="status"></div>
<script>
// 폰: 카메라 → JPEG → WS. 계약: docs/03-messages.md §3
const q = new URLSearchParams(location.search);
const SID = q.get("s"), TOKEN = q.get("t");
const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");

let ws, stream, facing = "user", running = false;
let cfg = { fps: 15, width: 480, quality: 0.7, max_inflight: 2 };
let inflight = 0, sent = 0, skipped = 0, stats = {};

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/phone?s=${SID}&t=${encodeURIComponent(TOKEN)}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("dot").classList.add("on"); $("conn").textContent = `세션 ${SID} 연결됨`; inflight = 0; sendHello(); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "config") cfg = { ...cfg, ...m };
    else if (m.type === "ack") inflight = Math.max(0, inflight - 1);
    else if (m.type === "stats") stats = m;
    render();
  };
  ws.onclose = (ev) => {
    $("dot").classList.remove("on");
    const reason = { 4401: "토큰 오류 — QR을 다시 스캔하세요", 4404: "세션 없음 — 그림판을 새로고침 후 QR 재스캔", 4409: "다른 폰이 연결됨" }[ev.code];
    $("conn").textContent = reason || "연결 끊김, 재시도 중…";
    if (!reason) setTimeout(connect, 1000);
  };
}

function sendHello() {
  if (ws?.readyState !== WebSocket.OPEN || !stream) return;
  const s = stream.getVideoTracks()[0].getSettings();
  ws.send(JSON.stringify({ type: "hello", w: s.width, h: s.height, facing, ua: navigator.userAgent }));
}

async function startCamera() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false,
  });
  video.srcObject = stream;
  video.classList.toggle("mirror", facing === "user");
  await video.play();
  sendHello();
  if (!running) { running = true; loop(); }
}

function loop() {
  const t0 = performance.now();
  if (ws?.readyState === WebSocket.OPEN && video.videoWidth) {
    if (inflight >= cfg.max_inflight) skipped++;      // 흐름 제어: 미확인 프레임이 많으면 건너뜀
    else {
      canvas.width = cfg.width;
      canvas.height = Math.round(cfg.width * video.videoHeight / video.videoWidth);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);   // 원본 그대로 (반전은 C 가 처리)
      inflight++;
      canvas.toBlob((b) => { if (b && ws.readyState === WebSocket.OPEN) { ws.send(b); sent++; } else inflight--; },
                    "image/jpeg", cfg.quality);
    }
  }
  setTimeout(loop, Math.max(0, 1000 / cfg.fps - (performance.now() - t0)));
}

function render() {
  $("status").textContent =
    `sent ${sent}  skipped ${skipped}  inflight ${inflight}/${cfg.max_inflight}\n` +
    `server fps ${stats.fps_done ?? "-"}  latency ${stats.latency_ms ?? "-"}ms  hand ${stats.hand ? "✋" : "-"}`;
}

$("start").onclick = () => startCamera().then(() => ($("start").textContent = "카메라 동작 중"))
  .catch((e) => alert(`카메라 오류: ${e.message}\n(HTTPS 주소로 접속했는지 확인하세요)`));
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; if (stream) startCamera(); };

if (!SID || !TOKEN) $("conn").textContent = "QR 코드로 접속하세요";
else connect();
</script>
</body>
</html>
